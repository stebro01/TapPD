[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "Motryx"
version = "0.3.0"
description = "Movement Lab - contactless movement assessment (Leap Motion, webcam, video)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "PyQt6>=6.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "sidecar: needs the MediaPipe sidecar venv (slow; skipped when it is not set up)",
]
