# Capture / MediaPipe sidecar settings.
# The main app reads these and pushes them to the sidecar over the socket on
# connect ({"cmd":"config",...}) — the sidecar venv has no pyyaml.

sidecar:
  preview_fps: 15          # throttle for the (heavy) JPEG preview stream
  preview_max_width: 640   # downscale preview frames to at most this width
  jpeg_quality: 70         # preview JPEG quality (0–100)
  hand_confidence: 0.5     # MediaPipe min hand-detection confidence
  tracking_confidence: 0.5 # MediaPipe min hand-tracking confidence
  num_hands: 2             # live default (VideoLab uses 1 for unilateral paradigms)
  record_fps: 30           # fps for live-recorded clips (Sim default clip)
  record_codec: avc1       # cv2 fourcc for live recording (H.264)
  # Capture format requested from the camera. 0 = let the driver decide.
  # Cameras offering several modes (e.g. an OBSBOT Tiny 2: 640x480 / 720p /
  # 1080p) otherwise pick one themselves. Higher costs CPU in MediaPipe, and
  # more than 720p buys little for hand landmarks — the driver may also just
  # refuse and fall back (the sidecar logs what it actually got).
  camera_width: 0          # e.g. 1280 for 720p, 1920 for 1080p
  camera_height: 0         # e.g. 720          , 1080
  camera_fps: 0            # e.g. 30

readiness:
  ready_y_mm: 120.0        # Leap: hand counts as "in position" above this height
  min_confidence: 0.5      # webcam/mock: min hand confidence to be "ready"

preview:
  hand_stale_s: 0.3        # clear a hand panel if no frame for this long

# ── Orientierung & Händigkeit je Eingangsquelle ──────────────────────────────
# Eine Quelle wird durch zwei Angaben vollständig beschrieben:
#
#   mirror           Wird das Bild horizontal gespiegelt, bevor es jemand sieht
#                    oder auswertet? (Vorschau, MediaPipe, Overlay)
#   swap_handedness  Wird das Etikett links/rechts ZUSÄTZLICH getauscht?
#
# WICHTIG — die zu `mirror` gehörende Label-Korrektur ist KEIN Schalter:
# MediaPipe vergibt links/rechts aus Sicht des Bildes, das es bekommt. Wird das
# Bild gespiegelt, dreht sich das Label mit, also dreht der Sidecar es
# automatisch zurück (sidecar.py::_handedness). Beide lesen dasselbe Flag und
# können nicht auseinanderlaufen.
#
# `swap_handedness` ist der Zusatztausch OBENDRAUF — nur für Kameras, die
# bereits in Hardware spiegeln. Auf dem Tracking-Screen entspricht er der
# Checkbox „Händigkeit vertauschen"; hier steht lediglich ihr Startwert.
sources:
  leap:
    # Kein Kamerabild: der Sensor meldet die anatomische Seite direkt
    # (eLeapHandType_Left). Hier wird nichts gespiegelt und nichts getauscht.
    mirror: false
    swap_handedness: false

  webcam:
    # Live-Kamera zeigt auf den Patienten -> Spiegelansicht, damit die linke
    # Hand links erscheint. Selbst aufgenommene Clips (Sim) werden ROH
    # gespeichert und laufen deshalb unter genau dieser Einstellung.
    mirror: true
    swap_handedness: false

  video:
    # Importiertes Material: ob es seitenverkehrt ist, hängt vom Aufnahmegerät
    # ab. Das hier ist nur die Vorgabe für neue Videos — massgeblich ist das
    # Flag am Video selbst (VideoLab, Checkbox „Gespiegelt").
    mirror: false
    swap_handedness: false
